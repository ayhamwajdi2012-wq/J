<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
<meta name="theme-color" content="#faf9f5">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد ذكي</title>

<style>
:root{--bg:#05060b;--panel:#0e1019;--line:#1f2336;--txt:#edeff8;--mut:#8a90ab;--acc:#7c5cff;--g:linear-gradient(135deg,#6d5efc,#b05cff 50%,#22d3ee);--gl:#ffffff0a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font:15.5px/1.8 "Segoe UI",system-ui,-apple-system,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#2a2f4a;border-radius:6px}

.aur{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aur i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.28;will-change:transform;animation:fl 22s ease-in-out infinite alternate}
.aur i:nth-child(1){background:#6d5efc;top:-25vmax;right:-15vmax}
.aur i:nth-child(2){background:#22d3ee;bottom:-30vmax;left:-20vmax;animation-delay:-8s;opacity:.18}
.aur i:nth-child(3){background:#b05cff;top:30%;left:35%;width:30vmax;height:30vmax;animation-delay:-14s;opacity:.14}
@keyframes fl{to{transform:translate3d(6vmax,4vmax,0) scale(1.15)}}

#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto}

header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#05060bb3;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
header h1{font-size:18px;flex:1;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
header h1 b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg{width:34px;height:34px;border-radius:12px;background:var(--g);display:grid;place-items:center;font-size:17px;box-shadow:0 0 22px #7c5cffaa,inset 0 1px 0 #fff5}
.bdg{font-size:11.5px;padding:4px 11px;border-radius:20px;border:1px solid #22d3ee44;color:#7ee7fb;background:#22d3ee12;direction:ltr;font-weight:600}
.bdg::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-inline-end:6px;box-shadow:0 0 8px #22c55e}
.ib{width:40px;height:40px;border-radius:13px;font-size:20px;transition:background .1s}.ib:hover{background:#ffffff12}

#msgs{flex:1;overflow-y:auto;padding:20px 14px;scroll-behavior:auto}
.m{margin-bottom:22px;display:flex;gap:11px;align-items:flex-start}
.m.u{flex-direction:column;align-items:flex-end}
.m.u .b{background:var(--g);color:#fff;border-radius:20px 20px 5px 20px;padding:11px 17px;max-width:86%;width:fit-content;white-space:pre-wrap;word-break:break-word;box-shadow:0 8px 28px #7c5cff40,inset 0 1px 0 #fff4}
.av{flex:none;width:34px;height:34px;border-radius:12px;background:var(--g);display:grid;place-items:center;font-size:16px;box-shadow:0 0 16px #7c5cff77,inset 0 1px 0 #fff5;margin-top:2px}
.bd{flex:1;min-width:0}
.m.a .b{word-break:break-word}
.b div.p{margin:3px 0}.b h2,.b h3,.b h4{margin:14px 0 5px;font-weight:700}
.b a{color:#7ee7fb;text-decoration:none;border-bottom:1px solid #7ee7fb55}
.b code.i{background:#171a2b;border:1px solid var(--line);padding:1px 7px;border-radius:7px;direction:ltr;unicode-bidi:embed;font-size:13px;color:#c9b8ff}
.q{border-inline-start:3px solid var(--acc);padding-inline-start:12px;color:var(--mut)}

.cb{margin:12px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#080a12;direction:ltr;text-align:left;box-shadow:0 8px 30px #0008}
.cb.pr{border-color:#b05cff55;background:#130e22}
.cb .h{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:#12152299;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.6px}
.cb.pr .h{background:#1d1334;color:#dcbcff}
.cb pre{padding:14px;overflow-x:auto;font:13px/1.65 ui-monospace,"SF Mono",Menlo,Consolas,monospace;white-space:pre;color:#d9defa}
.cb.pr pre{white-space:pre-wrap;font-family:inherit;font-size:14.5px;direction:auto;text-align:start}
.t-c{color:#667094;font-style:italic}.t-s{color:#86efac}.t-n{color:#fbbf24}.t-k{color:#c792ff}.t-t{color:#7ee7fb}
.cp{font-size:12px;color:var(--mut);padding:4px 11px;border-radius:9px;text-transform:none;letter-spacing:0;transition:background .1s}.cp:hover{background:#ffffff16;color:var(--txt)}

.ft{display:flex;gap:6px;margin-top:5px}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;justify-content:flex-end}
.att span{background:var(--gl);border:1px solid var(--line);border-radius:11px;padding:2px 11px;font-size:13px}
.att img{max-width:210px;max-height:180px;border-radius:16px;border:1px solid var(--line)}

.dots span{display:inline-block;width:8px;height:8px;margin:11px 3px;border-radius:50%;background:var(--g);animation:d .9s infinite}
.dots span:nth-child(2){animation-delay:.12s}.dots span:nth-child(3){animation-delay:.24s}
@keyframes d{50%{opacity:.25;transform:translateY(-4px)}}

#empty{text-align:center;margin-top:8vh;animation:up .3s ease-out}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
#empty .big{width:88px;height:88px;margin:0 auto 18px;border-radius:28px;background:var(--g);display:grid;place-items:center;font-size:44px;box-shadow:0 0 70px #7c5cffbb,inset 0 2px 0 #fff6;animation:pl 4s ease-in-out infinite}
@keyframes pl{50%{transform:translateY(-6px);box-shadow:0 0 90px #22d3ee88,inset 0 2px 0 #fff6}}
#empty h2{font-size:34px;font-weight:800;letter-spacing:.3px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#empty p{color:var(--mut);margin:8px 0 26px}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:11px;max-width:560px;margin:0 auto}
.chip{background:var(--gl);border:1px solid var(--line);border-radius:18px;padding:14px;font-size:14px;text-align:start;transition:transform .12s,border-color .12s,background .12s;backdrop-filter:blur(8px)}
.chip:hover{background:#7c5cff1f;border-color:#7c5cffaa;transform:translateY(-2px)}

footer{padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));position:relative}
#files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#files span{background:var(--gl);border:1px solid var(--line);border-radius:11px;padding:2px 11px;font-size:13px;cursor:pointer}

.box{display:flex;align-items:flex-end;gap:6px;background:#0e1019d9;backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;padding:7px;transition:border-color .15s,box-shadow .15s;box-shadow:0 10px 40px #0007}
.box:focus-within{border-color:#7c5cffbb;box-shadow:0 0 0 4px #7c5cff22,0 10px 50px #7c5cff33}
textarea{flex:1;background:none;border:0;outline:0;color:var(--txt);font:inherit;resize:none;max-height:180px;padding:9px 6px}
textarea::placeholder{color:#6a7090}

#send{width:42px;height:42px;border-radius:50%;background:var(--g);font-size:17px;flex:none;box-shadow:0 6px 20px #7c5cff77,inset 0 1px 0 #fff5;transition:transform .1s}
#send:active{transform:scale(.9)}

#menu{position:absolute;bottom:72px;inset-inline-start:14px;background:#12152a;border:1px solid var(--line);border-radius:16px;padding:6px;display:none;z-index:5;box-shadow:0 16px 50px #000b}
#menu button{display:block;width:100%;text-align:start;padding:10px 18px;border-radius:11px;white-space:nowrap}
#menu button:hover{background:#ffffff12}

#side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:305px;max-width:86vw;background:#0a0c14f2;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-inline-end:1px solid var(--line);transform:translateX(100%);transition:transform .13s;z-index:20;display:flex;flex-direction:column;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}
html[dir=ltr] #side{transform:translateX(-100%)}
#side.open{transform:none!important}
#ov{position:fixed;inset:0;background:#000a;display:none;z-index:15}
#side .nw{background:var(--g);border-radius:15px;padding:13px;margin-bottom:16px;font-weight:700;box-shadow:0 8px 26px #7c5cff55,inset 0 1px 0 #fff4}
#side h4{color:var(--mut);font-size:12px;margin-bottom:7px;padding:0 4px}
#list{overflow-y:auto;flex:1}
.ci{padding:11px 13px;border-radius:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin-bottom:3px;border:1px solid transparent}
.ci:hover{background:#ffffff0c}.ci.cur{background:#7c5cff1f;border-color:#7c5cff55}

.md{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(5px)}
.md.show{display:flex}
.card{background:#12152a;border:1px solid var(--line);border-radius:22px;padding:24px;width:100%;max-width:390px;box-shadow:0 24px 70px #000d}
.card h2{font-size:17px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1;padding:13px;border-radius:15px;border:1px solid var(--line)}
.row .dng{background:#dc2626;border-color:#dc2626;font-weight:700}

.ib.on{background:var(--g);box-shadow:0 0 16px #7c5cff88}

.gi{margin:10px 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#080a12;width:min(100%,520px);box-shadow:0 14px 44px #000a}
.gi img{display:block;width:100%;height:auto}
.gb{display:flex;padding:9px;justify-content:flex-end;background:#12152a}
.dl{display:inline-block;background:var(--g);padding:9px 20px;border-radius:13px;font-weight:700;color:#fff;text-decoration:none;box-shadow:0 6px 20px #7c5cff55,inset 0 1px 0 #fff4}

.img-loading{width:min(100%,520px);aspect-ratio:1;border-radius:18px;border:1px solid var(--line);background:linear-gradient(110deg,#12152a 30%,#272d50 50%,#12152a 70%);background-size:200% 100%;animation:sh 1s linear infinite;display:grid;place-items:center;color:#9ba3c7;font-size:14px}

.sk{width:min(100%,380px);aspect-ratio:1;border-radius:18px;border:1px solid var(--line);background:linear-gradient(110deg,#12152a 30%,#1f2444 50%,#12152a 70%);background-size:200% 100%;animation:sh 1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

header h1{cursor:pointer;user-select:none}.car{font-size:13px;color:var(--mut)}
.bdg{max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg:not(.on){opacity:.55}

#pick{position:absolute;top:62px;inset-inline-start:12px;width:min(94%,390px);max-height:72vh;overflow-y:auto;background:#0c0e18f5;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;padding:8px;z-index:30;display:none;box-shadow:0 24px 70px #000d}
#pick.show{display:block}
.ps{font-size:12px;color:var(--mut);padding:10px 12px 4px;font-weight:700}
.pi{padding:10px 12px;border-radius:13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid transparent}
.pi:hover{background:#ffffff0d}.pi.sel{background:#7c5cff22;border-color:#7c5cff66}
.pi small{color:var(--mut);font-size:12px;white-space:nowrap}
.pi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#dn{position:absolute;bottom:98px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;background:#12152af0;border:1px solid var(--line);display:none;z-index:4;box-shadow:0 8px 24px #000a}
.ex{margin-top:10px;padding:11px;border-radius:13px;border:1px solid var(--line);color:var(--mut)}.ex:hover{background:#ffffff0c;color:var(--txt)}

@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
::selection{background:#7c5cff66}
.aur::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff66 1px,transparent 1.6px);background-size:44px 44px;opacity:.08;-webkit-mask-image:radial-gradient(circle at 50% 35%,#000,transparent 78%);mask:radial-gradient(circle at 50% 35%,#000,transparent 78%)}
header h1 b{background:linear-gradient(90deg,#9a8bff,#e08cff,#4ee0f5,#9a8bff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shm 7s linear infinite}
@keyframes shm{to{background-position:250% 0}}
.lg{position:relative}
.lg::after{content:"";position:absolute;inset:-3px;border-radius:15px;border:1px solid #7c5cff77;animation:pg 2.8s ease-out infinite;pointer-events:none}
@keyframes pg{to{transform:scale(1.4);opacity:0}}
.box{position:relative}
.box::after{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),#6d5efc,#22d3ee,#b05cff,#6d5efc);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .2s;animation:rot 4s linear infinite;pointer-events:none}
.box:focus-within::after{opacity:1}
@keyframes rot{to{--a:360deg}}
.m.a .b{background:linear-gradient(180deg,#ffffff0a,#ffffff04);border:1px solid #ffffff10;border-radius:6px 22px 22px 22px;padding:12px 17px;box-shadow:0 8px 30px #0005}
.m.a .b:empty{display:none}
.cb .h::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff5f57;box-shadow:16px 0 0 #febc2e,32px 0 0 #28c840;margin-right:44px}
.cb.pr .h::before{display:none}
.cb .h span{flex:1}
.cb{transition:border-color .15s}.cb:hover{border-color:#7c5cff66}
.chip{box-shadow:0 6px 24px #0004}.chip:hover{box-shadow:0 10px 34px #7c5cff33}
.caps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:-8px auto 24px;max-width:540px}
.caps span{font-size:12px;padding:5px 13px;border-radius:20px;border:1px solid var(--line);background:#ffffff08;color:#b9bfdc}
.sb{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:800;font-size:16px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.src{font-size:12px;padding:4px 11px;border-radius:20px;border:1px solid #22d3ee44;background:#22d3ee10;color:#7ee7fb;text-decoration:none;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.src:hover{background:#22d3ee22}
#send{position:relative}
.box:focus-within #send{box-shadow:0 6px 26px #7c5cffaa,inset 0 1px 0 #fff5}

@media(max-width:480px){
  .chips{grid-template-columns:1fr}
  #empty{margin-top:4vh}
  #empty h2{font-size:28px}
}
@media(prefers-reduced-motion:reduce){.aur i,#empty .big{animation:none}}

/* ===== NEBULA UI UPGRADE — visual layer only ===== */
:root{
  --bg:#03040a;--panel:#0b1020;--line:#29284a;--txt:#f5f6ff;
  --mut:#a1a8c9;--acc:#9b7bff;
  --g:linear-gradient(125deg,#7257ff 0%,#b45cff 42%,#22d3ee 100%);
  --gl:#ffffff0b;
}
body{
  background:
    radial-gradient(ellipse at 15% 0%,#32206b55,transparent 42%),
    radial-gradient(ellipse at 95% 80%,#063c5b44,transparent 38%),
    #03040a;
}
#app{max-width:1040px}
header{
  padding:13px 18px;
  background:linear-gradient(180deg,#0b0c18eF,#070811c9);
  border-bottom:1px solid #8b7aff2b;
  box-shadow:0 8px 35px #0005;
}
header h1{font-size:19px;gap:12px}
.lg{
  width:39px;height:39px;border-radius:14px;
  box-shadow:0 0 26px #8464ff88,inset 0 1px 0 #ffffff80;
}
.bdg{border-color:#38d9f655;background:#22d3ee12}
#msgs{padding:26px clamp(14px,3vw,30px);scroll-padding-bottom:24px}
.m{gap:13px;margin-bottom:26px;animation:msgIn .18s ease-out}
@keyframes msgIn{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.m.u .b{
  border:1px solid #ffffff26;
  box-shadow:0 10px 34px #6f51ff35,inset 0 1px 0 #ffffff45;
  border-radius:22px 22px 6px 22px;
  padding:13px 18px;
}
.av{
  width:38px;height:38px;border-radius:14px;
  background:linear-gradient(145deg,#17172d,#272044);
  border:1px solid #9e83ff65;color:#d9ccff;
  box-shadow:0 0 22px #765aff25,inset 0 1px 0 #ffffff1a;
}
.m.a .b{
  background:linear-gradient(145deg,#111323d9,#0a0c17eF);
  border:1px solid #ffffff12;border-inline-start:2px solid #8e70ff;
  border-radius:6px 22px 22px 22px;
  padding:15px 19px;box-shadow:0 12px 36px #0005;
}
.cb{border-color:#363253;border-radius:17px;background:#070913;box-shadow:0 12px 32px #0006}
.cb .h{background:linear-gradient(90deg,#17152a,#101523);padding:9px 13px}
.cb pre{padding:16px;font-size:13px;line-height:1.72;tab-size:2}
.cb.pr{background:#120e22;border-color:#8f68d955}
.cp{border:1px solid #ffffff12}
.cp:hover{background:#8d70ff20;border-color:#9276ff66}
footer{
  padding:10px 15px;padding-bottom:max(14px,env(safe-area-inset-bottom));
  background:linear-gradient(0deg,#05060bf5,#05060bba 75%,transparent);
}
.box{
  gap:8px;padding:8px;border-radius:25px;
  background:linear-gradient(145deg,#111426f5,#090b16f5);
  border-color:#51457d8a;
  box-shadow:0 15px 45px #0008,0 0 0 1px #ffffff05,inset 0 1px 0 #ffffff0d;
}
.box:focus-within{
  border-color:#9c7bff;
  box-shadow:0 0 0 4px #8865ff1c,0 12px 42px #6748ff2b;
}
textarea{padding:10px 8px;max-height:220px;line-height:1.65}
#send{
  width:45px;height:45px;
  box-shadow:0 7px 23px #7c5cff66,inset 0 1px 0 #ffffff55;
}
.ib{border-radius:14px;transition:background .15s,transform .15s}
.ib:active,.chip:active{transform:scale(.96)}
.chip{
  background:linear-gradient(145deg,#111426d9,#0a0c16eF);
  border-color:#34304f;border-radius:19px;padding:15px;
  box-shadow:0 8px 26px #0004;
}
.chip:hover{border-color:#9277ff;background:#17132a}
#empty .big{border-radius:30px;box-shadow:0 0 80px #795bff77,inset 0 2px 0 #ffffff65}
#empty h2{font-size:clamp(28px,5vw,39px)}
#side{
  background:linear-gradient(160deg,#101126f7,#070911f8);
  border-inline-end-color:#7864c844;box-shadow:0 0 55px #0008;
}
#side .nw{border-radius:16px}
.ci{border-radius:14px}
.ci.cur{background:linear-gradient(100deg,#7658ff22,#22d3ee0b);border-color:#9074ff55}
#menu,#pick,.card{
  background:linear-gradient(145deg,#15172bf7,#0b0d19fa);
  border-color:#454064;box-shadow:0 24px 70px #000c;
}
.md{backdrop-filter:blur(12px)}
.att span,#files span{border-color:#37324f;background:#151526}
.src{border-color:#31cce744}
@media(max-width:480px){
  header{padding-inline:11px}
  header h1{font-size:16px;gap:7px}
  .lg{width:33px;height:33px}
  #msgs{padding:18px 11px}
  .m.a .b{padding:13px 14px}
  .m.u .b{max-width:94%}
  footer{padding-inline:9px}
  .box{gap:3px;padding:6px}
  .box .ib{width:35px;height:38px;font-size:18px}
  #send{width:40px;height:40px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}


/* Immediate response feedback */
.typing-now{display:flex;align-items:center;gap:5px;min-height:24px;color:var(--muted);font-size:13px}
.typing-now i{width:6px;height:6px;border-radius:50%;background:var(--accent,#9d7bff);animation:typingPulse .9s infinite ease-in-out}
.typing-now i:nth-child(2){animation-delay:.15s}.typing-now i:nth-child(3){animation-delay:.3s}
.typing-now span{margin-inline-start:5px}
@keyframes typingPulse{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* Deep-space polish: visual-only layer */
body{background:radial-gradient(ellipse at 50% -15%,#211347 0,transparent 48%),radial-gradient(ellipse at 100% 100%,#062d3b55,transparent 38%),#020309}
header{background:linear-gradient(180deg,#090a15f5,#05060be8);border-bottom-color:#8e73ff40;box-shadow:0 10px 36px #0008}
#mp{padding:4px 7px;border-radius:16px;transition:background .2s}

/* =========================
   MARKDOWN
========================= */

function inl(s){
  return esc(s)
    .replace(/`([^`\n]+)`/g,'<code class="i">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}

function table(rows){

  const cells=r=>
    r.trim()
      .replace(/^\||\|$/g,"")
      .split("|")
      .map(c=>c.trim());

  const h=cells(rows[0]);

  let o=
    '<div style="overflow-x:auto"><table style="border-collapse:collapse;margin:6px 0"><tr>'+
    h.map(c=>
      `<th style="border:1px solid var(--line);padding:5px 10px;background:#1a1c22">${inl(c)}</th>`
    ).join("")+
    "</tr>";

  rows.slice(2).forEach(r=>{
    o+=
      "<tr>"+
      cells(r).map(c=>
        `<td style="border:1px solid var(--line);padding:5px 10px">${inl(c)}</td>`
      ).join("")+
      "</tr>";
  });

  return o+"</table></div>";
}

function text(s){

  const L=s.split("\n"),o=[];

  for(let i=0;i<L.length;i++){

    const l=L[i];
    let m;

    if(
      /^\s*\|.*\|\s*$/.test(l)&&
      /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1]||"")
    ){
      const r=[];

      while(i<L.length&&/\|/.test(L[i]))
        r.push(L[i++]);

      i--;
      o.push(table(r));

    }else if(m=l.match(/^(#{1,4})\s+(.*)/)){

      o.push(
        `<h${Math.min(m[1].length+1,4)}>${inl(m[2])}</h${Math.min(m[1].length+1,4)}>`
      );

    }else if(m=l.match(/^\s*[-*]\s+(.*)/)){

      o.push(`<div class="p">• ${inl(m[1])}</div>`);

    }else if(m=l.match(/^\s*(\d+)\.\s+(.*)/)){

      o.push(`<div class="p">${m[1]}. ${inl(m[2])}</div>`);

    }else if(m=l.match(/^>\s?(.*)/)){

      o.push(`<div class="q">${inl(m[1])}</div>`);

    }else if(l.trim()===""){

      o.push('<div style="height:6px"></div>');

    }else{

      o.push(`<div class="p" dir="auto">${inl(l)}</div>`);

    }
  }

  return o.join("");
}


const KW="function|const|let|var|return|if|else|for|while|class|import|from|export|default|new|async|await|try|catch|throw|switch|case|break|continue|def|print|in|is|not|and|or|None|True|False|true|false|null|undefined|this|public|private|static|void|int|string|echo|extends|interface|type|struct|fn|use|SELECT|FROM|WHERE|INSERT|UPDATE|DELETE|CREATE|TABLE|JOIN|ORDER|BY|GROUP|LIMIT|AND|OR|NOT|NULL";

function hl(code,lang){

  const hash=/^(py|python|bash|sh|shell|yaml|yml|ruby|rb|toml)$/.test(lang);

  const re=new RegExp(
    "("+
    (hash?"#[^\\n]*|":"")+
    "\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/|<!--[\\s\\S]*?-->|--[^\\n]*(?=\\n|$))|"+
    "(\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'|`(?:\\\\.|[^`\\\\])*`)|"+
    "(\\b\\d+(?:\\.\\d+)?\\b)|"+
    "(\\b(?:"+KW+")\\b)|"+
    "(<\\/?[a-zA-Z][\\w-]*)",
    "g"
  );

  let o="",i=0,m;

  if(code.length>20000)
    return esc(code);

  while((m=re.exec(code))){

    if(m[0]==="")
      break;

    o+=esc(code.slice(i,m.index));

    const c=
      m[1]!==undefined?"c":
      m[2]!==undefined?"s":
      m[3]!==undefined?"n":
      m[4]!==undefined?"k":
      "t";

    o+=`<span class="t-${c}">${esc(m[0])}</span>`;

    i=m.index+m[0].length;
  }

  return o+esc(code.slice(i));
}

function md(s){

  let o="",i=0;

  const re=/```([\w+#-]*)[^\n]*\n([\s\S]*?)(```|$)/g;

  let m;

  while((m=re.exec(s))){

    o+=text(s.slice(i,m.index));

    const lang=(m[1]||"").toLowerCase();
    const pr=lang==="prompt";

    o+=
      `<div class="cb${pr?" pr":""}">
        <div class="h">
          <span>${pr?"Prompt":esc(m[1]||"code")}</span>
          <button class="cp" data-c="1">نسخ</button>
        </div>
        <pre>${pr?esc(m[2].replace(/\n$/,"")):hl(m[2].replace(/\n$/,""),lang)}</pre>
      </div>`;

    i=m.index+m[0].length;

    if(m[3]==="")
      break;
  }

  return o+text(s.slice(i));
}

  }

                href="${esc(z.u)}"

            </a>`
          ).join("")
        }</div>`
      :"";

  const ft=

          <button class="cp ht${m.liked?" on":""}" data-h="${idx}" title="أعجبني">${m.liked?"♥":"♡"}</button>
          ${last
            ?'<button class="cp rg" id="regen" title="إعادة التوليد">↻</button>'
            :""
          }
        </div>`
      :"";

  return `
    <div class="m a">

      <div class="av">✺</div>

      <div class="bd">

        <div class="b${m.err?" err":""}">

          ${busy && last && !m.content ? '<div class="typing-now"><i></i><i></i><i></i><span>يكتب الآن...</span></div>' : ''}

          ${body}

        </div>

        ${sh}

        ${ft}

      </div>

    </div>`;
}

function addFile(f){

  const isImg=f.type.startsWith("image/");

  const o={
    name:f.name,
    type:isImg?"img":"txt",
    mime:f.type
  };

  pend.push(o);

  renderFiles();

  if(isImg){

    const img=new Image();
    const u=URL.createObjectURL(f);

    img.onload=()=>{

      const k=
        Math.min(
          1,
          1280/
          Math.max(
            img.width,
            img.height
          )
        );

      const cv=document.createElement("canvas");

      cv.width=img.width*k;
      cv.height=img.height*k;

      cv.getContext("2d")
        .drawImage(
          img,
          0,
          0,
          cv.width,
          cv.height
        );

      o.mime="image/jpeg";

      o.data=
        cv.toDataURL(
          "image/jpeg",
          .8
        )
        .split(",")[1];

      URL.revokeObjectURL(u);
    };

    img.src=u;

  }else{

    const r=new FileReader();

    r.onload=()=>{
      o.text=String(r.result).slice(0,200000);
    };

    r.readAsText(f);
  }
}

var abortFn=null;

const url=m=>
  `${BASE}/models/${encodeURIComponent(m)}:streamGenerateContent?alt=sse`;


function xhrStream(m,body,onData){

  return new Promise((res,rej)=>{

    const x=new XMLHttpRequest();

    x.open(
      "POST",
      url(m)
    );

    x.setRequestHeader(
      "Content-Type",
      "application/json"
    );

    x.setRequestHeader(
      "x-goog-api-key",
      (KEY||getSavedApiKey("gemini"))
    );

    let pos=0;

    const pull=()=>{

      const t=
        x.responseText.slice(pos);

      pos=x.responseText.length;

      if(t)
        onData(t);
    };

    x.onprogress=()=>{
      if(x.status===200)
        pull();
    };

    x.onload=()=>{

      if(x.status===200){

        pull();

        res({
          status:200
        });

      }else{

        res({
          status:x.status,
          err:x.responseText
        });
      }
    };

    x.onerror=()=>{
      rej(new TypeError("net"));
    };

    x.onabort=()=>{
      res({
        status:0,
        aborted:true
      });
    };

    abortFn=()=>{
      x.abort();
    };

    x.send(body);

  });
}


async function fetchStream(m,body,onData){

  const r=await fetch(
    url(m),
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-goog-api-key":(KEY||getSavedApiKey("gemini"))
      },
      body
    }
  );

  if(!r.ok){

    return{
      status:r.status,
      err:await r.text()
    };
  }

  const rd=r.body.getReader();

  const dc=new TextDecoder();

  abortFn=()=>{
    rd.cancel();
  };

  for(;;){

    const{
      done,
      value
    }=await rd.read();

    if(done)
      break;

    onData(
      dc.decode(
        value,
        {stream:true}
      )
    );
  }

  return{
    status:200
  };
}


async function call(m,body,onData){

  try{

    return await xhrStream(
      m,
      body,
      onData
    );

  }catch(e){

    return await fetchStream(
      m,
      body,
      onData
    );
  }
}

function memText(exId,budget,mx){
  const others=chats.filter(c=>c.id!==exId&&c.msgs&&c.msgs.length).sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(!others.length)return"";
  const per=Math.max(400,Math.floor(budget/others.length));
  let out="",left=budget;
  for(const c of others){
    if(left<250)break;
    const cap=Math.min(per,left);
    let d="";try{d=new Date(c.ts||0).toLocaleDateString("ar")}catch{}
    const head="## "+(c.title||"محادثة")+(d?" ("+d+")":"")+"\n";
    let used=head.length;const lines=[];
    for(let i=c.msgs.length-1;i>=0;i--){
      const m=c.msgs[i];
      let t=(m.content||"").replace(/\s+/g," ").trim();
      if(!t&&m.files&&m.files.length)t="[مرفقات: "+m.files.map(f=>f.name).join("، ")+"]";
      if(!t)continue;
      if(t.length>mx)t=t.slice(0,mx)+"…";
      const ln=(m.role==="user"?"المستخدم: ":"المساعد: ")+t+"\n";
      if(used+ln.length>cap&&lines.length)break;
      lines.unshift(ln);used+=ln.length;
    }
    const blk=head+lines.join("")+"\n";
    out+=blk;left-=blk.length;
  }
  return out;
}

function memBlock(id,prov){

}

function gline(raw,a){
  const l=raw.trim();
  if(!l.startsWith("data:"))return;
  const d=l.slice(5).trim();

  try{
    const j=JSON.parse(d);

  }catch{}
}

async function run(){
  if(ld("cgp.provider","gemini")==="groq")return runGroq();
  const c=curChat();
  if(!c)return;
  const a={role:"assistant",content:""};
  const list=apiMsgs(c);
  c.msgs.push(a);
  setBusy(true);render();stopF=false;abortFn=null;
  window.MEM=memBlock(c.id,"gemini");
  const body=gbody(list,0,false);
  const cands=[...new Set([PK().text,ld("cgp.model",null),...MODELS].filter(Boolean))];
  let lastErr="";
  try{
    for(let i=0;i<cands.length&&!stopF;i++){
      const model=cands[i];
      const controller=new AbortController();
      abortFn=()=>controller.abort();
      let response;
      try{
        response=await fetch(url(model),{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":(KEY||getSavedApiKey("gemini"))},body,signal:controller.signal});
      }catch(err){lastErr=String(err&&err.message||err);continue;}
      if(!response.ok){
        let t=await response.text();
        try{t=JSON.parse(t).error.message||t}catch{}
        lastErr=String(t).slice(0,300);
        if([400,404,429,500,503].includes(response.status))continue;
        break;
      }
      try{
        const reader=response.body.getReader();
        const decoder=new TextDecoder();
        let buffer="";
        while(true){
          const {done,value}=await reader.read();
          if(done||stopF)break;
          buffer+=decoder.decode(value,{stream:true});
          const lines=buffer.split("\n");buffer=lines.pop();
          for(const raw of lines)gline(raw,a);
          updLast();
        }
        if(buffer)gline(buffer,a);
      }catch(err){lastErr=String(err&&err.message||err);}
      if(a.content){sv("cgp.model",model);setBdg(model);break;}
      if(stopF)break;
    }
    if(!a.content&&!stopF){
      a.content="لم يصل الرد من جيمناي"+(lastErr?"\n\n> "+lastErr.replace(/\s+/g," ").slice(0,200):"");
    }
    if(stopF&&!a.content)c.msgs.pop();
  }finally{
    setBusy(false);abortFn=null;c.ts=Date.now();save();render();renderList();
  }
}

        [404,429,503]
        .includes(res.status)
      ){

        if(
          i===cands.length-1&&
          !second
        ){

          second=true;

          const ex=
            (
              await discover()
            )
            .filter(
              x=>
                !tried.includes(x)
            );

          cands=
            cands.concat(ex);
        }

        continue;
      }

      break;
    }

    if(buf)
      line(buf);

    if(
      stopF||
      (res&&res.aborted)
    ){

      if(!a.content)
        c.msgs.pop();

    }else if(!found){

      let msg=
        res&&res.err||"";

      try{

        const j=
          JSON.parse(msg);

        msg=
          j.error?.message||
          msg;

      }catch{}

      throw new Error(
        String(msg).slice(0,300)||
        ("خطأ "+(res&&res.status))
      );

    }else if(!a.content){

      a.content=" ";
    }

  }catch(e){

    console.error(
      "gemini:",
      e&&e.message
    );

    if(!stopF){

      const net=
        /^net$|Failed to fetch|NetworkError|Load failed/i
        .test(e.message);

      if(
        net&&
        t<2&&
        !a.content
      ){

        c.msgs.pop();

        return await run(t+1);
      }

      if(!a.content)
        a.fail=true;

    }else if(!a.content){

      c.msgs.pop();
    }

  }finally{

    setBusy(false);

    abortFn=null;

    c.ts=Date.now();

    save();

    render();

    renderList();
  }
}

function setBdg(m){

  b.textContent=provider==="groq" ? "Groq · "+(GROQ_MODELS.find(x=>x.id===m)?.name||m||"متصل") :
    "Gemini"+
    (
      m
        ?" · "+
          arName(m)
          .replace(
            /^Gemini /,
            ""
          )
        :""
    );

  b.classList.add("on");

function loadModels(){

  return new Promise(res=>{

    const x=
      new XMLHttpRequest();

    x.open(
      "GET",
      `${BASE}/models?pageSize=200`
    );

    x.setRequestHeader(
      "x-goog-api-key",
      (KEY||getSavedApiKey("gemini"))
    );

    x.onload=()=>{

      if(x.status!==200){

        res(null);

        return;
      }

      try{

        const d=
          JSON.parse(
            x.responseText
          );

        const all=
          (d.models||[])
          .filter(
            m=>
              (
                m.supportedGenerationMethods||[]
              )
              .includes(
                "generateContent"
              )
          )
          .map(
            m=>({
              id:
                m.name.replace(
                  /^models\//,
                  ""
                ),

              name:
                m.displayName||
                m.name
            })
          )
          .filter(
            m=>
              /^gemini/.test(m.id)
          );

        const v=m=>
          parseFloat(
            (
              m.id.match(
                /(\d+(?:\.\d+)?)/
              )||[0,0]
            )[1]
          );

        const srt=(a,b)=>
          v(b)-v(a)||
          (
            /flash/.test(b.id)?1:0
          )-
          (
            /flash/.test(a.id)?1:0
          )||
          a.id.localeCompare(b.id);

        models={

          txt:
            all
            .filter(
              m=>
                !/(image|tts|audio|live|embedding|robotics|computer|aqa|native)/.test(m.id)
            )
            .sort(srt),

          img:
            all
            .filter(
              m=>
                /image/.test(m.id)
            )
            .sort(srt)
        };

        sv(
          "cgp.models",
          models
        );

        if(
          !ld("cgp.model",null)&&
          !PK().text
        ){

          const fm=
            models.txt.find(
              m=>
                /flash/.test(m.id)&&
                !/(lite|preview)/.test(m.id)
            )||
            models.txt[0];

          if(fm)
            sv(
              "cgp.model",
              fm.id
            );
        }

        setBdg(
          PK().text||
          ld(
            "cgp.model",
            null
          )
        );

        res(models);

      }catch{

        res(null);
      }

    };

    x.onerror=()=>{
      res(null);
    };

    x.send();
  });
}

function runGroq(){
  const c=curChat();
  if(!c)return;
  const a={role:"assistant",content:""};
  const list=apiMsgs(c);
  c.msgs.push(a);
  setBusy(true);render();stopF=false;abortFn=null;
  const model=ld("cgp.groqmodel","llama-3.3-70b-versatile");
  const messages=[{role:"system",content:SYS+memBlock(c.id,"groq")+(window.getSavedInstruction?window.getSavedInstruction("groq"):"")},...list.map(x=>({
    role:x.role==="assistant"?"assistant":"user",
    content:x.text||" "
  }))];
  let reader=null;
  (async()=>{
    try{
      const controller=new AbortController();
      abortFn=()=>controller.abort();
      const response=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+(GROQ_KEY||getSavedApiKey("groq"))},
        body:JSON.stringify({model,messages,stream:true,temperature:0.7}),
        signal:controller.signal
      });
      if(!response.ok)throw new Error((await response.text()).slice(0,400)||("HTTP "+response.status));
      reader=response.body.getReader();
      const decoder=new TextDecoder();
      let buffer="";
      while(true){
        const {done,value}=await reader.read();
        if(done||stopF)break;
        buffer+=decoder.decode(value,{stream:true});
        const lines=buffer.split("\n");buffer=lines.pop();
        for(const raw of lines){
          const line=raw.trim();
          if(!line.startsWith("data:"))continue;
          const data=line.slice(5).trim();
          if(!data||data==="[DONE]")continue;
          try{
            const j=JSON.parse(data);
            a.content+=(j.choices?.[0]?.delta?.content||"");
          }catch{}
        }
        updLast();
      }
      if(!a.content&&!stopF) a.content="لم يصل الرد من جورك";
    }catch(err){
      if(!stopF&&!a.content) a.content="لم يصل الرد من جورك";
      console.error("Groq:",err?.message||err);
    }finally{
      setBusy(false);abortFn=null;c.ts=Date.now();save();render();renderList();
    }
  })();
}

const SR=

  window.webkitSpeechRecognition;

if(!SR){

  $("#mic").style.display="none";

}else{

  let rc=null;
  let on=false;

  $("#mic").onclick=()=>{

    if(on){

      rc.stop();

      return;
    }

    rc=new SR();

    rc.lang="ar-SA";

    rc.interimResults=true;
    rc.continuous=true;

    const base=
      inp.value
        ?inp.value+" "
        :""

    inp.value=base;
    on=true;
    $("#mic").classList.add("on");
    try{rc.start();}catch(e){on=false;$("#mic").classList.remove("on");}
    rc.onresult=e=>{
      let interim="",finalText="";
      for(let i=0;i<e.results.length;i++){
        const item=e.results[i];
        if(item.isFinal) finalText+=item[0].transcript;
        else interim+=item[0].transcript;
      }
      inp.value=base+finalText+interim;
      inp.dispatchEvent(new Event("input"));
    };
    rc.onerror=()=>{on=false;$("#mic").classList.remove("on");};
    rc.onend=()=>{on=false;$("#mic").classList.remove("on");};
  };
}

async function send(){
  if(busy){stopGen();return;}
  const value=inp.value.trim();
  if(!value&&!pend.length)return;
  if(!cur){
    cur="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    chats.push({id:cur,title:(value||pend[0]?.name||"محادثة جديدة").slice(0,42),ts:Date.now(),msgs:[]});
  }
  const c=curChat();
  if(!c)return;
  const files=pend.map(f=>({...f}));
  c.msgs.push({role:"user",content:value,files});
  pend=[];
  renderFiles();
  inp.value="";
  inp.style.height="auto";
  save();
  render();
  renderList();
  await run();
}

    }
    return;

    if(m){
      m.liked=!m.liked;

      ht.classList.toggle("on",m.liked);
      ht.textContent=m.liked?"♥":"♡";
      toast("شكراً لتقييمك");
    }
    return;
  }
  const mc=e.target.closest("[data-m]");
  if(mc){
    const m=curChat()?.msgs[Number(mc.dataset.m)];
    if(m)try{await navigator.clipboard.writeText(m.content||"");mc.textContent="تم النسخ ✓";}catch{}
    return;
  }
  const ed=e.target.closest("[data-e]");
  if(ed){
    const c=curChat(),m=c?.msgs[Number(ed.dataset.e)];
    if(!m||busy)return;
    inp.value=m.content||"";
    c.msgs=c.msgs.slice(0,Number(ed.dataset.e));
    save();render();inp.dispatchEvent(new Event("input"));inp.focus();
    return;
  }
  if(e.target.closest("#regen")){
    const c=curChat();
    if(c&&!busy){
      const last=c.msgs[c.msgs.length-1];
      if(last?.role==="assistant")c.msgs.pop();
      save();render();run();
    }
  }
});

  const originalGeminiBody=gbody;
  gbody=function(list,tm,use){const data=JSON.parse(originalGeminiBody(list,tm,use));data.systemInstruction.parts[0].text+=window.getSavedInstruction('gemini');return JSON.stringify(data)};
  const gate=$id('googleGate'), fab=$id('settingsFab'), panel=$id('settingsPanel'), sheet=$id('settingsSheet');
  const escHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function showGate(){gate.style.display='flex';fab.style.display='none';document.getElementById('app').style.display='none'}
  function showApp(){gate.style.display='none';document.getElementById('app').style.display='flex';fab.style.display='flex';if(typeof render==='function'){render();renderList();renderFiles()}}
  function googleReady(){return !!(window.google&&google.accounts&&google.accounts.oauth2)}
  function waitGoogle(){return new Promise((resolve,reject)=>{let n=0;const t=setInterval(()=>{if(googleReady()){clearInterval(t);resolve()}else if(++n>60){clearInterval(t);reject(new Error('تعذر تحميل خدمة Google'))}},150)})}
  const loginButton=$id('googleLogin');
  const loginButtonHTML=loginButton.innerHTML;
  let loginPending=false,loginWatchdog=null;
  function resetLoginButton(){
    loginPending=false;
    if(loginWatchdog){clearTimeout(loginWatchdog);loginWatchdog=null}
    loginButton.disabled=false;
    loginButton.innerHTML=loginButtonHTML;
  }
  function setLoginBusy(){
    loginPending=true;
    loginButton.disabled=true;
    loginButton.innerHTML='<span style="display:inline-flex;align-items:center;gap:12px"><span class="login-spinner" aria-hidden="true"></span><span>جارٍ فتح تسجيل Google…</span></span>';
    if(loginWatchdog)clearTimeout(loginWatchdog);
    loginWatchdog=setTimeout(()=>{
      if(loginPending){
        resetLoginButton();
        toast('تم إلغاء محاولة تسجيل الدخول. يمكنك المحاولة مجدداً');
      }
    },45000);
  }
  async function login(){
    if(loginPending)return;
    setLoginBusy();
    try{
      await waitGoogle();
      const client=google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_CLIENT_ID,
        scope:AUTH_SCOPE,
        include_granted_scopes:true,
        ux_mode:'popup',
        callback:async response=>{
          loginPending=false;
          if(loginWatchdog){clearTimeout(loginWatchdog);loginWatchdog=null}
          try{
            if(response.error)throw new Error(response.error_description||response.error);
            if(!response.access_token)throw new Error('لم يصل رمز الدخول من Google');
            accessToken=response.access_token;
            const me=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+accessToken}});
            if(!me.ok)throw new Error('تعذر قراءة بيانات حساب Google ('+me.status+')');
            const user=await me.json();
            write(STORE_KEY,{sub:user.sub,email:user.email,name:user.name,picture:user.picture});
            if(!profile.name)profile.name=user.name||'';
            write(PROFILE_KEY,profile);
            await restoreCloud();
            showApp();
            startSync();
            toast('تم تسجيل الدخول بنجاح');
          }catch(err){
            accessToken='';
            alert(err.message||'تعذر تسجيل الدخول');
            showGate();
          }finally{
            resetLoginButton();
          }
        },
        error_callback:error=>{
          const reason=error&&error.type||'';
          resetLoginButton();
          if(reason!=='popup_closed'){
            toast(reason==='popup_failed_to_open'
              ?'تعذر فتح نافذة Google. اسمح بالنوافذ المنبثقة ثم حاول مجدداً'
              :'تعذر إكمال تسجيل الدخول. حاول مرة أخرى');
          }
        }
      });
      client.requestAccessToken({prompt:'select_account'});
    }catch(err){
      resetLoginButton();
      alert(err.message||'تعذر فتح تسجيل Google');
    }
  }
  loginButton.addEventListener('click',login);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&loginPending){
      setTimeout(()=>{if(loginPending)resetLoginButton()},1200);
    }
  });

  async function driveFetch(url,opts={}){const r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+accessToken,...(opts.headers||{})}});if(!r.ok)throw new Error('Google Drive HTTP '+r.status);return r}
  async function restoreCloud(){
    try{
      const q=encodeURIComponent("name='ayham-chat-data.json' and 'appDataFolder' in parents and trashed=false");
      const r=await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+q+'&fields=files(id,name)');
      const data=await r.json();
      driveFileId=data.files?.[0]?.id||'';
      if(!driveFileId){lastUploaded='';return}
      const fr=await driveFetch('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?alt=media');
      const cloud=await fr.json();
      if(cloud&&cloud.owner&&read(STORE_KEY,{})?.sub!==cloud.owner)return;
      const localChats=Array.isArray(chats)?chats:[];
      const map=new Map((cloud.chats||[]).map(c=>[c.id,c]));
      for(const c of localChats){const old=map.get(c.id);if(!old||(c.ts||0)>(old.ts||0))map.set(c.id,c)}
      chats=[...map.values()].sort((a,b)=>(b.ts||0)-(a.ts||0));
      if(cloud.profile&&(!profile.name&&!profile.age))profile=cloud.profile;
      if(cloud.instructions)instructions={...instructions,...cloud.instructions};
      if(cloud.theme)write(THEME_KEY,cloud.theme);
      write(PROFILE_KEY,profile);write(INSTRUCTIONS_KEY,instructions);
      if(typeof save==='function')save();
      lastUploaded='';
    }catch(e){console.warn('Cloud restore:',e.message)}
  }
  async function uploadCloud(){
    if(!accessToken||!driveFileId&&driveFileId===null)return;
    const payload={owner:read(STORE_KEY,{})?.sub||'',chats:typeof chats!=='undefined'?chats:[],profile,instructions,theme:read(THEME_KEY,'dark'),updatedAt:Date.now()};
    const json=JSON.stringify(payload);if(json===lastUploaded)return;
    try{
      if(driveFileId){await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+driveFileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:json})}
      else{
        const boundary='ayham_'+Math.random().toString(16).slice(2);
        const meta=JSON.stringify({name:'ayham-chat-data.json',mimeType:'application/json',parents:['appDataFolder']});
        const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+json+'\r\n--'+boundary+'--';
        const r=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
        driveFileId=(await r.json()).id;
      }
      lastUploaded=json;
    }catch(e){console.warn('Cloud sync:',e.message)}
  }
  function startSync(){if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(uploadCloud,3500);setTimeout(uploadCloud,900)}
  function openPanel(){panel.classList.add('show');panel.setAttribute('aria-hidden','false');renderSettingsHome()}
  function closePanel(){panel.classList.remove('show');panel.setAttribute('aria-hidden','true')}
  fab.addEventListener('click',openPanel);panel.addEventListener('click',e=>{if(e.target===panel)closePanel()});
  function header(title,back=false){return `<div class="settings-head">${back?'<button class="settings-back" id="settingsBack">‹ رجوع</button>':'<span></span>'}<h2>${title}</h2><button class="settings-close" id="settingsClose">×</button></div>`}
  function wireClose(){const x=$id('settingsClose');if(x)x.onclick=closePanel;const b=$id('settingsBack');if(b)b.onclick=renderSettingsHome}
  function renderSettingsHome(){
    const user=read(STORE_KEY,{});
    sheet.innerHTML=header('الإعدادات')+`
      <button class="settings-item" id="accountOpen"><span>الحساب<small>${escHtml(user.email||'حساب Google')}</small></span><span class="arr">‹</span></button>
      <button class="settings-item" id="customOpen"><span>التخصيص<small>تعليمات Gemini وGroq</small></span><span class="arr">‹</span></button>
      <button class="settings-item" id="themeOpen"><span>المظهر<small>${read(THEME_KEY,'dark')==='dark'?'الوضع الداكن':'العادي'}</small></span><span class="arr">‹</span></button>`;
    wireClose();$id('accountOpen').onclick=renderAccount;$id('customOpen').onclick=renderCustom;$id('themeOpen').onclick=renderTheme;
  }
  function renderAccount(){
    const user=read(STORE_KEY,{});
    sheet.innerHTML=header('الحساب',true)+`
      <button class="settings-item" id="editName"><span>الاسم<small>${escHtml(profile.name||user.name||'لم يُحدد')}</small></span><span class="arr">‹</span></button>
      <button class="settings-item" id="editAge"><span>العمر<small>${escHtml(profile.age||'لم يُحدد')}</small></span><span class="arr">‹</span></button>
      <button class="settings-danger" id="logout">تسجيل الخروج من الحساب</button>`;
    wireClose();$id('editName').onclick=()=>editProfile('name','الاسم','اكتب الاسم');$id('editAge').onclick=()=>editProfile('age','العمر','اكتب العمر');
    $id('logout').onclick=()=>confirmLogout();
  }
  function editProfile(key,title,placeholder){
    const old=profile[key]||(key==='name'?read(STORE_KEY,{})?.name||'':'');
    sheet.innerHTML=header(title,true)+`<label>${title}</label><input class="settings-field" id="profileValue" ${key==='age'?'type="number" min="1" max="120"':''} placeholder="${placeholder}" value="${escHtml(old)}"><button class="settings-primary" id="saveProfile">حفظ</button>`;
    wireClose();$id('saveProfile').onclick=()=>{profile[key]=$id('profileValue').value.trim();write(PROFILE_KEY,profile);uploadCloud();renderAccount();toast('تم الحفظ')};
  }
  function renderCustom(){
    sheet.innerHTML=header('التخصيص',true)+`<button class="settings-item" id="geminiCustom"><span>Gemini<small>${instructions.gemini?'تم حفظ تعليمات':'إضافة تعليمات'}</small></span><span class="arr">‹</span></button><button class="settings-item" id="groqCustom"><span>Groq<small>${instructions.groq?'تم حفظ تعليمات':'إضافة تعليمات'}</small></span><span class="arr">‹</span></button>`;
    wireClose();$id('geminiCustom').onclick=()=>editInstruction('gemini');$id('groqCustom').onclick=()=>editInstruction('groq');
  }
  function editInstruction(provider){
    const label=provider==='gemini'?'Gemini':'Groq';
    sheet.innerHTML=header(label,true)+`<label>اكتب التعليمات</label><textarea class="settings-field" id="instructionValue" rows="7" placeholder="اكتب التعليمات التي تريد من النموذج اتباعها">${escHtml(instructions[provider]||'')}</textarea><button class="settings-primary" id="saveInstruction">حفظ</button>`;
    wireClose();$id('saveInstruction').onclick=()=>{instructions[provider]=$id('instructionValue').value.trim();write(INSTRUCTIONS_KEY,instructions);uploadCloud();renderCustom();toast('تم الحفظ')};
  }
  function renderTheme(){
    const theme=read(THEME_KEY,'dark');
    sheet.innerHTML=header('المظهر',true)+`<button class="settings-choice ${theme==='light'?'active':''}" id="lightTheme">العادي</button><button class="settings-choice ${theme==='dark'?'active':''}" id="darkTheme">الوضع الداكن</button>`;
    wireClose();$id('lightTheme').onclick=()=>setTheme('light');$id('darkTheme').onclick=()=>setTheme('dark');
  }
  function setTheme(t){write(THEME_KEY,t);document.body.classList.toggle('light-user',t==='light');renderTheme();uploadCloud()}
  function confirmLogout(){
    sheet.innerHTML=header('تسجيل الخروج')+`<p style="margin:18px 0;text-align:center">هل أنت متأكد من تسجيل الخروج من الحساب؟</p><div style="display:flex;gap:10px"><button class="settings-primary" id="logoutYes" style="background:#b83232">نعم</button><button class="settings-primary" id="logoutNo" style="background:#444">لا</button></div>`;
    wireClose();$id('logoutNo').onclick=renderAccount;$id('logoutYes').onclick=async()=>{await uploadCloud();accessToken='';if(syncTimer)clearInterval(syncTimer);closePanel();showGate();toast('تم تسجيل الخروج')};
  }
  document.body.classList.toggle('light-user',read(THEME_KEY,'dark')==='light');
  // Existing browser-local chats remain intact until the user signs in and cloud data is merged.
  showGate();
})();
</script>
